name: Pages

on:
  push:
    branches: ["main"]   # nếu nhánh chính của thầy là 'master' thì đổi thành "master"
  workflow_dispatch: {}  # cho phép chạy thủ công từ tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dùng Node để tạo manifest.json từ thư mục tools/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-manifest.mjs

      # Đóng gói toàn bộ repo làm artifact để deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
